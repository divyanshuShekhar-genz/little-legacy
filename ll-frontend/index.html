<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Legacy · Admin</title>
    <!-- Ours: the prototype has no favicon. The PNG is for browsers without SVG icons. -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Matches the client prototype exactly: the body font stack starts with Inter but the
      prototype never downloads it, so it renders Inter only where installed, else the system
      UI font (Segoe UI on Windows, San Francisco on macOS). Only the footer serif is loaded.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
